name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and ABI consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: python -m pip install "ruff>=0.5"
      - name: Ruff
        run: ruff check src/DeepGPR tools
      - name: Native ABI table matches lib/deepgpr.h (no PyTorch needed)
        run: python -m unittest tests/test_native_abi.py -v

  cpu-tests:
    name: CPU unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy matplotlib
      - name: Build the CPU backend from source
        run: cc -std=c99 -O3 -fopenmp -fPIC -shared -o src/DeepGPR/lib/deepgpr_cpu.so src/DeepGPR/lib/deepgpr_cpu.c
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Equivalence with the pre-refactor release
        run: |
          git fetch --no-tags --depth=200 origin 73b2b5080f3a7f8828ad4a13e3538499e0d85ba5 || true
          python tools/verify_equivalence.py --device cpu --quick
