name: Build CUDA Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cuda: ['12.6.3']
        python: ['3.10']
        include:
          - os: ubuntu-latest
            platform: linux
            lib_ext: .so
          - os: windows-latest
            platform: windows
            lib_ext: .dll

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ matrix.cuda }}
          method: network

      - name: Set up MSVC Developer Command Prompt
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify nvcc
        run: nvcc --version

      - name: Verify cl.exe on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          where.exe cl
          cl

      # ==================== Linux Build ====================
      - name: Compile CUDA extension on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e

          cu_file="src/DeepGPR/lib/deepgpr.cu"
          out_file="src/DeepGPR/lib/deepgpr.so"

          if [ ! -f "$cu_file" ]; then
            echo "CUDA source file not found: $cu_file"
            exit 1
          fi

          nvcc -shared -Xcompiler -fPIC -D_GLIBCXX_USE_CXX11_ABI=0 \
               -o "$out_file" "$cu_file"

          if [ ! -f "$out_file" ]; then
            echo "Build failed: $out_file was not generated"
            exit 1
          fi

          echo "Built: $out_file"
          ls -lh "$out_file"

      # ==================== Windows Build ====================
      - name: Compile CUDA extension on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cu_file = "src\DeepGPR\lib\deepgpr.cu"
          $out_file = "src\DeepGPR\lib\deepgpr.dll"

          if (-not (Test-Path $cu_file)) {
            throw "CUDA source file not found: $cu_file"
          }

          nvcc -shared -o $out_file $cu_file

          if ($LASTEXITCODE -ne 0) {
            throw "nvcc failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $out_file)) {
            throw "Build failed: $out_file was not generated"
          }

          Write-Host "Built: $out_file"
          Get-Item $out_file | Format-List Name, Length, LastWriteTime

      # ==================== Upload immediately after build ====================
      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepgpr-${{ matrix.platform }}-cuda${{ matrix.cuda }}
          path: src/DeepGPR/lib/deepgpr${{ matrix.lib_ext }}
          if-no-files-found: error
          retention-days: 30
