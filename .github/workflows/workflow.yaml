name: Build CUDA Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
        matrix:
          include:
            - os: ubuntu-22.04
              platform: linux
              lib_ext: .so
              cuda: '12.6.3'
              python: '3.10'
            - os: windows-latest
              platform: windows
              lib_ext: .dll
              cuda: '12.6.3'
              python: '3.10'

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit on Linux
        if: matrix.platform == 'linux'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          log-file-suffix: 'linux-${{ matrix.cuda }}.txt'

      # ==================== Windows CUDA Toolkit ====================
      - name: Install CUDA Toolkit on Windows
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ matrix.cuda }}
          method: network

      - name: Set up MSVC Developer Command Prompt
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ==================== Verify toolchain ====================
      - name: Verify nvcc
        run: nvcc --version

      - name: Verify Linux build environment
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          echo "CUDA_PATH=$CUDA_PATH"
          which nvcc
          nvcc --version
          ldd --version
          gcc --version
          g++ --version

      - name: Verify Windows build environment
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          where.exe nvcc
          nvcc --version
          where.exe cl
          cl

      # ==================== Linux Build ====================
      - name: Compile CUDA extension on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e

          cu_file="src/DeepGPR/lib/deepgpr.cu"
          out_file="src/DeepGPR/lib/deepgpr.so"

          if [ ! -f "$cu_file" ]; then
            echo "CUDA source file not found: $cu_file"
            exit 1
          fi

          rm -f "$out_file"

          nvcc -shared \
               -Xcompiler -fPIC \
               -Xcompiler -static-libstdc++ \
               -Xcompiler -static-libgcc \
               -D_GLIBCXX_USE_CXX11_ABI=0 \
               -cudart static \
               -o "$out_file" "$cu_file"

          if [ ! -f "$out_file" ]; then
            echo "Build failed: $out_file was not generated"
            exit 1
          fi

          echo "Built: $out_file"
          ls -lh "$out_file"

      # ==================== Linux Compatibility Check ====================
      - name: Check Linux shared library compatibility
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e

          out_file="src/DeepGPR/lib/deepgpr.so"

          echo "ldd output:"
          ldd "$out_file" || true

          echo ""
          echo "Required GLIBC versions:"
          objdump -T "$out_file" | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq || true

          echo ""
          echo "Required GLIBCXX versions:"
          strings "$out_file" | grep -o 'GLIBCXX_[0-9.]*' | sort -V | uniq || true

          echo ""
          echo "Checking that GLIBC_2.34 is not required..."
          if objdump -T "$out_file" | grep -q 'GLIBC_2\.34'; then
            echo "ERROR: $out_file still requires GLIBC_2.34."
            echo "This means the .so is not compatible with older Linux systems."
            exit 1
          fi

          echo "Compatibility check passed: GLIBC_2.34 was not found."

      # ==================== Windows Build ====================
      - name: Compile CUDA extension on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cu_file = "src\DeepGPR\lib\deepgpr.cu"
          $out_file = "src\DeepGPR\lib\deepgpr.dll"

          if (-not (Test-Path $cu_file)) {
            throw "CUDA source file not found: $cu_file"
          }

          if (Test-Path $out_file) {
            Remove-Item $out_file -Force
          }

          nvcc -shared -cudart static -o $out_file $cu_file

          if ($LASTEXITCODE -ne 0) {
            throw "nvcc failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $out_file)) {
            throw "Build failed: $out_file was not generated"
          }

          Write-Host "Built: $out_file"
          Get-Item $out_file | Format-List Name, Length, LastWriteTime

      # ==================== Symbol Check on Linux ====================
      - name: Check exported symbols on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          echo "Exported symbols:"
          nm -D src/DeepGPR/lib/deepgpr.so | grep -E "forward|backward"

      # ==================== Symbol Check on Windows ====================
      - name: Check exported symbols on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dumpbin /exports src\DeepGPR\lib\deepgpr.dll

      # ==================== Upload Artifacts ====================
      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepgpr-${{ matrix.platform }}-cuda${{ matrix.cuda }}
          path: src/DeepGPR/lib/deepgpr${{ matrix.lib_ext }}
          if-no-files-found: error
          retention-days: 30