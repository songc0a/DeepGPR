name: Build Native Libraries

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            lib_ext: .so
            cuda: '11.8.0'
            cuda_container: 'nvidia/cuda:11.8.0-devel-ubuntu20.04'
            python: '3.10'

          - os: windows-2022
            platform: windows
            lib_ext: .dll
            cuda: '12.6.3'
            python: '3.10'

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit on Windows
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart"]'
          log-file-suffix: windows-${{ matrix.cuda }}.txt

      - name: Set up MSVC 2022 Developer Command Prompt
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python on Windows
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify Windows build environment
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          Write-Host "===== nvcc location ====="
          where.exe nvcc

          Write-Host "===== nvcc version ====="
          nvcc --version

          Write-Host "===== cl location ====="
          where.exe cl

          Write-Host "===== cl version ====="
          cmd.exe /c "cl 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cl printed version information without input files; continuing."
          }

      - name: Compile CUDA and CPU backends on Linux inside Ubuntu 20.04 container
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            "${{ matrix.cuda_container }}" \
            bash -lc '
              set -euo pipefail

              echo "===== Install build dependencies inside Ubuntu 20.04 container ====="
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                binutils \
                ca-certificates \
                file \
                python3 \
                python3-dev \
                python3-pip

              echo "===== Build environment ====="
              echo "Container image: ${{ matrix.cuda_container }}"

              echo "----- ldd version -----"
              ldd --version || true

              echo "----- gcc version -----"
              gcc --version || true

              echo "----- g++ version -----"
              g++ --version || true

              echo "----- nvcc version -----"
              nvcc --version || true

              cu_file="src/DeepGPR/lib/deepgpr.cu"
              cuda_out_file="src/DeepGPR/lib/deepgpr.so"

              c_file="src/DeepGPR/lib/deepgpr_cpu.c"
              cpu_out_file="src/DeepGPR/lib/deepgpr_cpu.so"

              if [ ! -f "$cu_file" ]; then
                echo "CUDA source file not found: $cu_file"
                exit 1
              fi

              if [ ! -f "$c_file" ]; then
                echo "CPU source file not found: $c_file"
                exit 1
              fi

              echo "===== Clean old Linux build artifacts ====="
              rm -f "$cuda_out_file" "$cpu_out_file"

              echo "===== Compile CUDA backend: $cuda_out_file ====="
              cuda_gencode_flags=(
                -gencode=arch=compute_50,code=sm_50
                -gencode=arch=compute_52,code=sm_52
                -gencode=arch=compute_60,code=sm_60
                -gencode=arch=compute_61,code=sm_61
                -gencode=arch=compute_70,code=sm_70
                -gencode=arch=compute_75,code=sm_75
                -gencode=arch=compute_80,code=sm_80
                -gencode=arch=compute_86,code=sm_86
                -gencode=arch=compute_89,code=sm_89
                -gencode=arch=compute_90,code=sm_90
              )

              nvcc -shared \
                   -O3 \
                   "${cuda_gencode_flags[@]}" \
                   -Xcompiler -fPIC \
                   -Xcompiler -static-libstdc++ \
                   -Xcompiler -static-libgcc \
                   -D_GLIBCXX_USE_CXX11_ABI=0 \
                   -cudart static \
                   -o "$cuda_out_file" "$cu_file"

              if [ ! -f "$cuda_out_file" ]; then
                echo "Build failed: $cuda_out_file was not generated"
                exit 1
              fi

              echo "===== Compile CPU backend: $cpu_out_file ====="
              cc -std=c99 \
                 -O3 \
                 -fopenmp \
                 -fPIC \
                 -shared \
                 -static-libgcc \
                 -o "$cpu_out_file" "$c_file"

              if [ ! -f "$cpu_out_file" ]; then
                echo "Build failed: $cpu_out_file was not generated"
                exit 1
              fi

              nm -D "$cuda_out_file" | grep deepgpr_abi_version
              nm -D "$cpu_out_file" | grep deepgpr_abi_version
              python3 -c "import ctypes; lib=ctypes.CDLL(\"./$cpu_out_file\"); assert lib.deepgpr_abi_version() == 3"

              echo "===== Built Linux libraries ====="
              ls -lh "$cuda_out_file" "$cpu_out_file"

              echo "===== Check CUDA backend dependencies ====="
              ldd "$cuda_out_file" || true

              echo ""
              echo "Required GLIBC versions for $cuda_out_file:"
              objdump -T "$cuda_out_file" | grep -o "GLIBC_[0-9.]*" | sort -V | uniq || true

              echo ""
              echo "Required GLIBCXX versions for $cuda_out_file:"
              strings "$cuda_out_file" | grep -o "GLIBCXX_[0-9.]*" | sort -V | uniq || true

              echo ""
              echo "Checking that GLIBC_2.34 is not required by $cuda_out_file..."
              if objdump -T "$cuda_out_file" | grep -q "GLIBC_2\.34"; then
                echo "ERROR: $cuda_out_file still requires GLIBC_2.34."
                echo "This means the .so is not compatible with older Linux systems."
                exit 1
              fi

              echo ""
              echo "===== Check CPU backend dependencies ====="
              ldd "$cpu_out_file" || true

              echo ""
              echo "Required GLIBC versions for $cpu_out_file:"
              objdump -T "$cpu_out_file" | grep -o "GLIBC_[0-9.]*" | sort -V | uniq || true

              echo ""
              echo "Required GLIBCXX versions for $cpu_out_file:"
              strings "$cpu_out_file" | grep -o "GLIBCXX_[0-9.]*" | sort -V | uniq || true

              echo ""
              echo "Checking that GLIBC_2.34 is not required by $cpu_out_file..."
              if objdump -T "$cpu_out_file" | grep -q "GLIBC_2\.34"; then
                echo "ERROR: $cpu_out_file still requires GLIBC_2.34."
                echo "This means the CPU .so is not compatible with older Linux systems."
                exit 1
              fi

              echo ""
              echo "===== Check exported Linux symbols ====="

              if ! nm -D "$cuda_out_file" | grep -E "forward|backward"; then
                echo "ERROR: expected CUDA backend symbols were not found."
                exit 1
              fi

              if ! nm -D "$cpu_out_file" | grep -E "forward|backward|set_fdtd_order"; then
                echo "ERROR: expected CPU backend symbols were not found."
                exit 1
              fi

              echo "Linux build and compatibility checks passed."
            '

      - name: Compile CUDA extension on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cu_file = "src\DeepGPR\lib\deepgpr.cu"
          $out_file = "src\DeepGPR\lib\deepgpr.dll"
          $lib_file = "src\DeepGPR\lib\deepgpr.lib"
          $exp_file = "src\DeepGPR\lib\deepgpr.exp"

          if (-not (Test-Path $cu_file)) {
            throw "CUDA source file not found: $cu_file"
          }

          if (Test-Path $out_file) {
            Remove-Item $out_file -Force
          }

          if (Test-Path $lib_file) {
            Remove-Item $lib_file -Force
          }

          if (Test-Path $exp_file) {
            Remove-Item $exp_file -Force
          }

          Write-Host "===== Build CUDA DLL ====="

          $cudaGencodeArgs = @(
            "-gencode=arch=compute_50,code=sm_50",
            "-gencode=arch=compute_52,code=sm_52",
            "-gencode=arch=compute_60,code=sm_60",
            "-gencode=arch=compute_61,code=sm_61",
            "-gencode=arch=compute_70,code=sm_70",
            "-gencode=arch=compute_75,code=sm_75",
            "-gencode=arch=compute_80,code=sm_80",
            "-gencode=arch=compute_86,code=sm_86",
            "-gencode=arch=compute_89,code=sm_89",
            "-gencode=arch=compute_90,code=sm_90"
          )

          $nvccArgs = @(
            "-shared",
            "-O3",
            "-std=c++17",
            "-allow-unsupported-compiler",
            "-cudart", "static",
            "-Xcompiler", "/MD",
            "-Xcompiler", "/O2",
            "-Xcompiler", "/EHsc",
            "-o", $out_file,
            $cu_file
          )

          $allNvccArgs = $cudaGencodeArgs + $nvccArgs
          & nvcc @allNvccArgs

          if ($LASTEXITCODE -ne 0) {
            throw "nvcc failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $out_file)) {
            throw "Build failed: $out_file was not generated"
          }

          Write-Host "Built: $out_file"
          Get-Item $out_file | Format-List Name, Length, LastWriteTime

      - name: Check exported symbols on Windows CUDA DLL
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll_file = "src\DeepGPR\lib\deepgpr.dll"

          if (-not (Test-Path $dll_file)) {
            throw "DLL not found: $dll_file"
          }

          Write-Host "===== Exported symbols from $dll_file ====="
          $exports = dumpbin /exports $dll_file
          $exports
          $hasAbiVersion = $exports | Select-String -SimpleMatch "deepgpr_abi_version" -Quiet
          if (-not $hasAbiVersion) {
            throw "CUDA DLL does not export deepgpr_abi_version"
          }

      - name: Compile CPU backend on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $c_file = "src\DeepGPR\lib\deepgpr_cpu.c"
          $out_file = "src\DeepGPR\lib\deepgpr_cpu.dll"
          $lib_file = "src\DeepGPR\lib\deepgpr_cpu.lib"
          $exp_file = "src\DeepGPR\lib\deepgpr_cpu.exp"
          $obj_file = "deepgpr_cpu.obj"

          if (-not (Test-Path $c_file)) {
            throw "CPU source file not found: $c_file"
          }

          if (Test-Path $out_file) {
            Remove-Item $out_file -Force
          }

          if (Test-Path $lib_file) {
            Remove-Item $lib_file -Force
          }

          if (Test-Path $exp_file) {
            Remove-Item $exp_file -Force
          }

          if (Test-Path $obj_file) {
            Remove-Item $obj_file -Force
          }

          Write-Host "===== Build CPU DLL with LLVM OpenMP runtime ====="

          & cl `
            /LD `
            /O2 `
            /MD `
            /TC `
            /openmp:llvm `
            "/Fe:$out_file" `
            $c_file

          if ($LASTEXITCODE -ne 0) {
            throw "cl failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $out_file)) {
            throw "Build failed: $out_file was not generated"
          }

          Write-Host "Built: $out_file"
          Get-Item $out_file | Format-List Name, Length, LastWriteTime

          Write-Host "===== Exported symbols from $out_file ====="
          $exports = dumpbin /exports $out_file
          $exports
          $hasAbiVersion = $exports | Select-String -SimpleMatch "deepgpr_abi_version" -Quiet
          if (-not $hasAbiVersion) {
            throw "CPU DLL does not export deepgpr_abi_version"
          }

          python -c "import ctypes; lib=ctypes.CDLL(r'$out_file'); assert lib.deepgpr_abi_version() == 3"

      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepgpr-${{ matrix.platform }}-cuda${{ matrix.cuda }}
          path: |
            src/DeepGPR/lib/deepgpr${{ matrix.lib_ext }}
            src/DeepGPR/lib/deepgpr_cpu${{ matrix.lib_ext }}
          if-no-files-found: error
          retention-days: 30

  build-cpu-macos:
    runs-on: macos-latest
    name: Build CPU backend on macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenMP runtime
        shell: bash
        run: brew install libomp

      - name: Compile CPU backend on macOS
        shell: bash
        run: |
          set -euo pipefail

          c_file="src/DeepGPR/lib/deepgpr_cpu.c"
          out_file="src/DeepGPR/lib/deepgpr_cpu.dylib"
          libomp_file="src/DeepGPR/lib/libomp.dylib"
          libomp_prefix="$(brew --prefix libomp)"
          libomp_runtime_name="/opt/llvm-openmp/lib/libomp.dylib"

          if [ ! -f "$c_file" ]; then
            echo "CPU source file not found: $c_file"
            exit 1
          fi

          rm -f "$out_file" "$libomp_file"

          cc -std=c99 -O3 \
             -Xpreprocessor -fopenmp \
             -DDEEPGPR_USE_OPENMP \
             -I"$libomp_prefix/include" \
             -L"$libomp_prefix/lib" \
             -fPIC -shared \
             -o "$out_file" "$c_file" \
             -lomp

          if [ ! -f "$out_file" ]; then
            echo "Build failed: $out_file was not generated"
            exit 1
          fi

          cp "$libomp_prefix/lib/libomp.dylib" "$libomp_file"
          install_name_tool -id "$libomp_runtime_name" "$libomp_file"

          libomp_dep="$(otool -L "$out_file" | awk '/libomp\.dylib/ {print $1; exit}')"
          if [ -z "$libomp_dep" ]; then
            echo "Could not find libomp dependency in $out_file"
            otool -L "$out_file"
            exit 1
          fi
          install_name_tool -change "$libomp_dep" "$libomp_runtime_name" "$out_file"

          codesign --force --sign - "$libomp_file"
          codesign --force --sign - "$out_file"

          echo "===== macOS CPU dependencies ====="
          otool -L "$out_file"
          otool -D "$libomp_file"

          nm -gU "$out_file" | grep -E "forward|backward|set_fdtd_order|deepgpr_abi_version"
          python3 -c "import ctypes; ctypes.CDLL('./$libomp_file', mode=ctypes.RTLD_GLOBAL); lib=ctypes.CDLL('./$out_file'); assert lib.deepgpr_abi_version() == 3"

      - name: Upload macOS CPU artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepgpr-macos-cpu
          path: |
            src/DeepGPR/lib/deepgpr_cpu.dylib
            src/DeepGPR/lib/libomp.dylib
          if-no-files-found: error
          retention-days: 30

  commit-built-libraries:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs:
      - build
      - build-cpu-macos
    runs-on: ubuntu-latest
    name: Commit built libraries to lib folder
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built library artifacts
        uses: actions/download-artifact@v4
        with:
          path: built-libs
          pattern: deepgpr-*
          merge-multiple: true

      - name: Copy libraries into package lib folder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/DeepGPR/lib

          copy_artifact() {
            local name="$1"
            local found
            found="$(find built-libs -type f -name "$name" | head -n 1)"
            if [ -z "$found" ]; then
              echo "Missing built library: $name"
              echo "Current downloaded files:"
              find built-libs -type f -maxdepth 5 -print || true
              exit 1
            fi
            cp "$found" "src/DeepGPR/lib/$name"
          }

          copy_artifact deepgpr.so
          copy_artifact deepgpr.dll
          copy_artifact deepgpr_cpu.so
          copy_artifact deepgpr_cpu.dll
          copy_artifact deepgpr_cpu.dylib
          copy_artifact libomp.dylib

          echo "===== Copied libraries ====="
          ls -lh src/DeepGPR/lib/deepgpr* src/DeepGPR/lib/libdeepgpr* 2>/dev/null || true
          ls -lh src/DeepGPR/lib/libomp.dylib 2>/dev/null || true

      - name: Commit generated libraries
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/DeepGPR/lib/deepgpr.so \
            src/DeepGPR/lib/deepgpr.dll \
            src/DeepGPR/lib/deepgpr_cpu.so \
            src/DeepGPR/lib/deepgpr_cpu.dll \
            src/DeepGPR/lib/deepgpr_cpu.dylib \
            src/DeepGPR/lib/libomp.dylib

          if git diff --cached --quiet; then
            echo "No generated library changes to commit."
            exit 0
          fi

          git commit -m "Build native DeepGPR libraries [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
